<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Py6Live - Ketik Python, Siswa Melihat Langsung</title>
<script type="importmap">
{
  "imports": {
    "codemirror": "https://cdn.jsdelivr.net/npm/codemirror@6.0.1/dist/index.js",
    "@codemirror/state": "https://cdn.jsdelivr.net/npm/@codemirror/state@6.4.1/dist/index.js",
    "@codemirror/view": "https://cdn.jsdelivr.net/npm/@codemirror/view@6.26.3/dist/index.js",
    "@codemirror/commands": "https://cdn.jsdelivr.net/npm/@codemirror/commands@6.6.0/dist/index.js",
    "@codemirror/language": "https://cdn.jsdelivr.net/npm/@codemirror/language@6.10.1/dist/index.js",
    "@codemirror/lint": "https://cdn.jsdelivr.net/npm/@codemirror/lint@6.7.1/dist/index.js",
    "@codemirror/search": "https://cdn.jsdelivr.net/npm/@codemirror/search@6.5.6/dist/index.js",
    "@codemirror/autocomplete": "https://cdn.jsdelivr.net/npm/@codemirror/autocomplete@6.16.0/dist/index.js",
    "@codemirror/lang-python": "https://cdn.jsdelivr.net/npm/@codemirror/lang-python@6.2.1/dist/index.js",
    "@codemirror/theme-one-dark": "https://cdn.jsdelivr.net/npm/@codemirror/theme-one-dark@6.1.2/dist/index.js",
    "@lezer/common": "https://cdn.jsdelivr.net/npm/@lezer/common@1.2.1/dist/index.js",
    "@lezer/highlight": "https://cdn.jsdelivr.net/npm/@lezer/highlight@1.2.0/dist/index.js",
    "@lezer/lr": "https://cdn.jsdelivr.net/npm/@lezer/lr@1.4.0/dist/index.js",
    "@lezer/python": "https://cdn.jsdelivr.net/npm/@lezer/python@1.1.10/dist/index.js",
    "style-mod": "https://cdn.jsdelivr.net/npm/style-mod@4.1.0/src/style-mod.js",
    "w3c-keyname": "https://cdn.jsdelivr.net/npm/w3c-keyname@2.2.8/index.js",
    "crelt": "https://cdn.jsdelivr.net/npm/crelt@1.0.6/index.js"
  }
}
</script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1e2530;
    --border: #2d3646;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3fb950;
    --accent-2: #58a6ff;
    --danger: #f85149;
    --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -100px, #1c2a3a 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
  }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  header { text-align: center; margin: 40px 0 28px; }
  .brand { font-size: 2.4rem; font-weight: 800; letter-spacing: -0.5px; }
  .brand span { color: var(--accent); }
  .tagline { color: var(--muted); margin: 6px 0 0; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }
  .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  button { cursor: pointer; font: inherit; }
  .role-card {
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 12px;
    padding: 28px 16px;
    font-size: 1.3rem;
    font-weight: 700;
    transition: transform .12s, border-color .12s;
  }
  .role-card small { display: block; font-weight: 400; color: var(--muted); margin-top: 6px; font-size: .9rem; }
  .role-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .join-form { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
  input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 1rem;
    outline: none;
  }
  input:focus { border-color: var(--accent-2); }
  .join-form button, .toolbar button {
    background: var(--accent);
    border: none;
    color: #0d1117;
    font-weight: 700;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 1rem;
  }
  .join-form button:hover, .toolbar button:hover { filter: brightness(1.1); }
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-bottom: 12px;
  }
  .room-info { font-size: .95rem; color: var(--muted); }
  .room-info b { color: var(--text); letter-spacing: 1px; }
  .badge { font-size: .75rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; }
  .badge.guru { background: rgba(63,185,80,.15); color: var(--accent); }
  .badge.siswa { background: rgba(88,166,255,.15); color: var(--accent-2); }
  #peers { color: var(--muted); font-size: .9rem; margin-left: auto; }
  .toolbar .ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .toolbar #btn-leave { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
  #banner {
    background: rgba(210,153,34,.12);
    border: 1px solid var(--warn);
    color: #e3b341;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: .95rem;
  }
  .status-bar {
    margin-top: 12px; display: flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: .9rem;
  }
  .posisi { margin-left: auto; font-size: .85rem; }
  .typing { color: var(--accent); font-size: .85rem; animation: kedip 1s ease-in-out infinite; }
  @keyframes kedip { 50% { opacity: .35; } }
  #status::before {
    content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px;
    border-radius: 50%; background: var(--accent);
  }
  #status.warn::before { background: var(--warn); }
  #status.warn { color: var(--warn); }
  #editor { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--bg); }
  #editor .cm-editor { font-size: 15px; min-height: 60vh; background: var(--bg); }
  #editor .cm-scroller { padding: 6px 0; }
  @media (max-width: 640px) {
    .role-grid { grid-template-columns: 1fr; }
    #editor .cm-editor { font-size: 16px; min-height: 70vh; }
  }
  .hidden { display: none !important; }
  .credit { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 32px; }
  #output-pane { margin-top: 12px; }
  .output-head { font-size: .75rem; font-weight: 800; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
  #output {
    margin: 6px 0 0; padding: 12px 14px; min-height: 56px; max-height: 240px; overflow: auto;
    background: #0b0f14; border: 1px solid var(--border); border-radius: 10px;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; color: var(--text);
  }
  #output .thin { color: var(--muted); }
  #output .stderr { color: var(--danger); }
  #btn-run:disabled { opacity: .6; cursor: progress; }
  .py-state { font-size: .8rem; color: var(--muted); }
  .err { color: var(--danger); font-size: .9rem; }
  .input-line { display: flex; align-items: center; gap: 4px; }
  .input-line::before { content: "> "; color: var(--accent); }
  .input-line.no-prefix::before { content: none; }
  .prompt { color: var(--text); }
  .run-input {
    flex: 1; min-width: 80px;
    background: transparent; border: none; color: var(--text);
    font: inherit; outline: none; padding: 0;
  }
  .run-input-btn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 2px 12px; font-size: .85rem; cursor: pointer;
  }
  .run-input-btn:hover { border-color: var(--accent); color: var(--accent); }
  .kelas-layout { display: flex; gap: 16px; align-items: flex-start; }
  .kolom-utama { flex: 1; min-width: 0; }
  #pane-siswa {
    width: 260px; flex-shrink: 0;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
    max-height: calc(100vh - 150px);
    position: sticky; top: 16px;
  }
  .pane-head {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    font-size: .9rem; font-weight: 700;
  }
  .pane-head span { color: var(--muted); font-weight: 400; }
  .list-siswa { overflow-y: auto; padding: 8px 8px 12px; }
  .row-siswa {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px; border-radius: 8px;
  }
  .row-siswa:hover { background: rgba(255,255,255,.04); }
  .avatar {
    width: 28px; height: 28px; flex-shrink: 0;
    border-radius: 50%;
    background: rgba(88,166,255,.2); color: var(--accent-2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: .8rem;
  }
  .row-nama { font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-nama.kosong { color: var(--muted); border: 1px dashed var(--border); border-radius: 8px; padding: 12px; text-align: center; width: 100%; }
  #btn-ikuti { font-size: .85rem; padding: 8px 12px; }
  #btn-ikuti.on { background: rgba(88,166,255,.15); color: var(--accent-2); border-color: var(--accent-2); }
  @media (max-width: 840px) {
    .kelas-layout { flex-direction: column; }
    #pane-siswa { width: 100%; max-height: 220px; position: static; }
  }
  .pane-title { font-size: .75rem; font-weight: 800; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  #peserta-pane { margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: rgba(88,166,255,.12); color: var(--text);
    border: 1px solid rgba(88,166,255,.35);
    border-radius: 999px; padding: 4px 12px; font-size: .85rem;
  }
  .chip.muted { border-style: dashed; color: var(--muted); border-color: var(--border); }
  .note { color: var(--muted); font-size: .85rem; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">Py6<span>Live</span></div>
    <p class="tagline">Guru mengetik Python real-time, siswa melihat langsung.</p>
  </header>

  <section id="screen-landing" class="card">
    <div class="role-grid">
      <button id="btn-guru" class="role-card guru">Saya Guru<small>Buat ruang kelas baru</small></button>
      <button id="btn-siswa" class="role-card siswa">Saya Siswa<small>Gabung pakai kode kelas</small></button>
    </div>
    <form id="form-guru" class="join-form hidden" autocomplete="off">
      <input id="inp-kode-guru" type="password" placeholder="Masukkan kode guru" required>
      <button type="submit">Buat Ruang Kelas</button>
      <div id="err-guru" class="err hidden"></div>
    </form>
    <form id="form-siswa" class="join-form hidden" autocomplete="off">
      <input id="inp-kode" placeholder="Kode ruang (contoh: A7K2M)" maxlength="5" required>
      <input id="inp-nama" placeholder="Nama kamu" maxlength="30" required>
      <button type="submit">Gabung Kelas</button>
    </form>
  </section>

  <section id="screen-editor" class="hidden">
    <div class="kelas-layout">
      <div class="kolom-utama">
        <div class="toolbar">
          <span class="room-info">Kode ruang: <b id="room-code"></b></span>
          <span id="role-badge" class="badge"></span>
          <span id="peers">1 peserta</span>
          <button id="btn-run" class="ghost hidden">Jalankan</button>
          <span id="py-state" class="py-state hidden"></span>
          <button id="btn-ikuti" class="ghost hidden">Ikuti guru: ON</button>
          <button id="btn-copy" class="ghost">Salin link</button>
          <button id="btn-leave">Keluar</button>
        </div>
        <div id="banner" class="hidden"></div>
        <div id="editor"></div>
        <div id="output-pane" class="hidden">
          <div id="output-head" class="output-head">Hasil Run</div>
          <div id="output" class="console" role="log"></div>
        </div>
        <div class="status-bar"><span id="status">Menghubungkan...</span><span id="typing" class="typing hidden">Guru sedang mengetik...</span><span id="posisi" class="posisi"></span></div>
        <p class="note" id="hint"></p>
      </div>
      <aside id="pane-siswa" class="hidden">
        <div class="pane-head">Peserta <span id="pane-count"></span></div>
        <div id="daftar-siswa" class="list-siswa"></div>
      </aside>
    </div>
  </section>

  <footer class="credit">by natedekaka</footer>
</main>

<script type="module">
  import { basicSetup } from "codemirror";
  import { EditorState } from "@codemirror/state";
  import { EditorView } from "@codemirror/view";
  import { python } from "@codemirror/lang-python";
  import { oneDark } from "@codemirror/theme-one-dark";

  const $ = (id) => document.getElementById(id);
  const S = {
    ws: null, peran: null, nama: null, kode: null,
    rev: 0, fatal: false, guruView: null, siswaView: null,
    debounce: null, ketikTimer: null, reconnectIn: null,
    ikuti: true, scrollTimer: null, scrollTerakhir: 0, ketikHide: null,
    barisTerakhir: null, paksaScroll: false, paksaTimer: null,
    running: false, promptBerikut: null, inputAktif: null,
  };

  const TEKS_AWAL = `# Selamat datang di Py6Live!
print("Halo, kelas!")

for i in range(3):
    print(f"Menghitung {i}...")`;

  function setStatus(teks, warn = false) {
    const el = $("status");
    el.textContent = teks;
    el.classList.toggle("warn", warn);
  }

  function setBanner(teks) {
    const b = $("banner");
    b.textContent = teks;
    b.classList.remove("hidden");
  }

  function tampilkanEditor(peran, kode, nama) {
    S.peran = peran; S.kode = kode; S.nama = nama;
    $("screen-landing").classList.add("hidden");
    $("screen-editor").classList.remove("hidden");
    $("room-code").textContent = kode;
    const badge = $("role-badge");
    badge.textContent = peran === "guru" ? "GURU" : "SISWA";
    badge.className = "badge " + peran;
    $("hint").textContent = peran === "guru"
      ? "Mulai mengetik. Siswa melihat teks real-time. Tekan 'Jalankan' untuk menjalankan; input() muncul di kolom hasil run."
      : "Teks diketik langsung oleh guru. Kamu bisa scroll bebas, tapi tidak bisa mengedit.";
    const punyaRun = peran === "guru";
    $("btn-run").classList.toggle("hidden", !punyaRun);
    $("py-state").classList.toggle("hidden", !punyaRun);
    $("pane-siswa").classList.toggle("hidden", !punyaRun);
    $("btn-ikuti").classList.toggle("hidden", punyaRun);
    S.ikuti = !punyaRun;
    perbaruiTombolIkuti();
    if (punyaRun) $("btn-run").classList.remove("ghost");
  }

  function perbaruiTombolIkuti() {
    const t = $("btn-ikuti");
    t.textContent = S.ikuti ? "Ikuti guru: ON" : "Ikuti guru: OFF";
    t.classList.toggle("on", S.ikuti);
  }

  function esc(t) {
    return String(t).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[c]);
  }

  function gantiTeks(view, teks) {
    const lama = view.state.doc.toString();
    if (lama === teks) return;
    view.dispatch({ changes: { from: 0, to: lama.length, insert: teks } });
  }

  function updatePosisi(view) {
    const el = $("posisi");
    if (!el) return;
    const sel = view.state.selection.main;
    const line = view.state.doc.lineAt(sel.head);
    el.textContent = `Baris ${line.number}, Kol ${sel.head - line.from + 1} · ${view.state.doc.lines} baris`;
  }

  function posisiStatus() {
    return EditorView.updateListener.of(u => updatePosisi(u.view));
  }

  function barisAtas(view) {
    try {
      const block = view.lineBlockAtHeight(view.scrollDOM.scrollTop + 2);
      return view.state.doc.lineAt(block.from).number;
    } catch {
      return 1;
    }
  }

  function scrollKeBaris(view, baris) {
    const doc = view.state.doc;
    const n = Math.max(1, Math.min(baris, doc.lines));
    const pos = doc.line(n).from;
    view.dispatch({ effects: EditorView.scrollIntoView(pos, { y: "start", yMargin: 8 }) });
    S.paksaScroll = true;
    clearTimeout(S.paksaTimer);
    S.paksaTimer = setTimeout(() => S.paksaScroll = false, 400);
  }

  function kirimScrollGuru() {
    if (S.peran !== "guru" || !S.ws || S.ws.readyState !== 1) return;
    const baris = barisAtas(S.guruView);
    if (baris === S.scrollTerakhir) return;
    clearTimeout(S.scrollTimer);
    S.scrollTimer = setTimeout(() => {
      S.scrollTerakhir = baris;
      S.ws.send(JSON.stringify({ tipe: "scroll", baris }));
    }, 90);
  }

  function onScrollSiswa() {
    if (S.peran !== "siswa" || !S.ikuti) return;
    const t = barisAtas(S.siswaView);
    if (typeof S.barisTerakhir === "number" && Math.abs(t - S.barisTerakhir) <= 2) return;
    S.ikuti = false;
    perbaruiTombolIkuti();
  }

  function scrollGuru() {
    return EditorView.scrollHandler.of(() => {
      if (S.peran === "guru") kirimScrollGuru();
      return false;
    });
  }

  function scrollSiswa() {
    return EditorView.scrollHandler.of(() => {
      onScrollSiswa();
      return false;
    });
  }

  function buatEditorGuru() {
    S.guruView = new EditorView({
      parent: $("editor"),
      state: EditorState.create({
        doc: TEKS_AWAL,
        extensions: [
          basicSetup,
          python(),
          oneDark,
          EditorView.lineWrapping,
          posisiStatus(),
          scrollGuru(),
          EditorView.updateListener.of(u => { if (u.docChanged) kirimPerubahanGuru(); }),
        ],
      }),
    });
    S.guruView.scrollDOM.addEventListener("scroll", kirimScrollGuru, { passive: true });
    updatePosisi(S.guruView);
  }

  function buatEditorSiswa() {
    S.siswaView = new EditorView({
      parent: $("editor"),
      state: EditorState.create({
        extensions: [
          basicSetup,
          python(),
          oneDark,
          EditorView.lineWrapping,
          posisiStatus(),
          scrollSiswa(),
          EditorState.readOnly.of(true),
          EditorView.editable.of(false),
        ],
      }),
    });
    S.siswaView.scrollDOM.addEventListener("scroll", onScrollSiswa, { passive: true });
    updatePosisi(S.siswaView);
  }

  function kirimPerubahanGuru() {
    clearTimeout(S.debounce);
    S.debounce = setTimeout(() => {
      const teks = S.guruView.state.doc.toString();
      if (S.ws && S.ws.readyState === 1) {
        S.ws.send(JSON.stringify({ tipe: "update", teks, baris: barisAtas(S.guruView) }));
      }
    }, 120);
    if (!S.ketikTimer && S.ws && S.ws.readyState === 1) {
      S.ketikTimer = setTimeout(() => S.ketikTimer = null, 400);
      S.ws.send(JSON.stringify({ tipe: "ketik", nama: S.nama }));
    }
  }

  function hubungkan() {
    S.fatal = false;
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/ws/${S.kode}`);
    S.ws = ws;
    ws.onopen = () => ws.send(JSON.stringify({ tipe: "hello", peran: S.peran, nama: S.nama }));
    ws.onmessage = (ev) => tangani(JSON.parse(ev.data));
    ws.onclose = () => {
      if (S.fatal) return;
      setStatus("Koneksi terputus. Mencoba menyambung ulang...", true);
      clearTimeout(S.reconnectIn);
      S.reconnectIn = setTimeout(hubungkan, 2000);
    };
    ws.onerror = () => ws.close();
  }

  function onWelcome(m) {
    S.rev = m.rev || 0;
    setStatus("Terhubung");
    onPeserta(m);
    if (m.peran === "siswa") {
      gantiTeks(S.siswaView, m.teks || "");
      if (typeof m.baris === "number") {
        S.barisTerakhir = m.baris;
        if (S.ikuti) scrollKeBaris(S.siswaView, m.baris);
      }
    } else {
      kirimPerubahanGuru();
      mulaiPramuatPython();
    }
  }

  function onUpdate(m) {
    if (S.peran !== "siswa") return;
    if (m.rev != null && S.rev > 0 && m.rev < S.rev) return;
    S.rev = m.rev ?? S.rev;
    gantiTeks(S.siswaView, m.teks);
    if (S.ikuti && typeof m.baris === "number") {
      scrollKeBaris(S.siswaView, m.baris);
    }
    if (typeof m.baris === "number") S.barisTerakhir = m.baris;
  }

  function tunjukMengetik() {
    if (S.peran !== "siswa") return;
    const el = $("typing");
    el.classList.remove("hidden");
    clearTimeout(S.ketikHide);
    S.ketikHide = setTimeout(() => el.classList.add("hidden"), 1200);
  }

  function onPeserta(m) {
    const g = m.guru ?? (m.jumlah ? 1 : 0);
    const s = m.siswa ?? (m.jumlah ? m.jumlah - 1 : 0);
    $("peers").textContent = `${g} guru · ${s} siswa`;
    if (S.peran === "guru") {
      const daftar = Array.isArray(m.daftar) ? m.daftar : [];
      $("pane-count").textContent = `(${daftar.length})`;
      $("daftar-siswa").innerHTML = daftar.length
        ? daftar.map(n => {
            const inisial = esc(n).trim().charAt(0).toUpperCase() || "?";
            return `<div class="row-siswa"><span class="avatar">${inisial}</span><span class="row-nama">${esc(n)}</span></div>`;
          }).join("")
        : '<span class="row-nama kosong">Belum ada siswa</span>';
    }
  }

  function tangani(m) {
    switch (m.tipe) {
      case "welcome": onWelcome(m); break;
      case "update": onUpdate(m); break;
      case "peserta": onPeserta(m); break;
      case "guru-keluar": setBanner(m.pesan); break;
      case "output": setOutput(m.teks, "Hasil run guru"); break;
      case "ketik": tunjukMengetik(); break;
      case "scroll":
        if (typeof m.baris === "number") S.barisTerakhir = m.baris;
        if (S.ikuti && S.peran === "siswa") {
          scrollKeBaris(S.siswaView, m.baris);
        }
        break;
      case "error":
        S.fatal = true;
        if (S.ws) S.ws.close();
        setBanner(m.pesan);
        setStatus("Koneksi gagal.", true);
        break;
    }
  }

  $("btn-guru").addEventListener("click", () => {
    $("form-siswa").classList.add("hidden");
    $("form-guru").classList.remove("hidden");
    $("inp-kode-guru").focus();
  });

  $("form-guru").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("form-guru").querySelector("button");
    const err = $("err-guru");
    btn.disabled = true;
    btn.textContent = "Membuat ruang...";
    err.classList.add("hidden");
    try {
      const res = await fetch("/api/ruang", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kode_guru: $("inp-kode-guru").value }),
      });
      if (res.status === 403) {
        err.textContent = "Kode guru salah.";
        err.classList.remove("hidden");
        return;
      }
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      tampilkanEditor("guru", data.kode, "Guru");
      buatEditorGuru();
      hubungkan();
    } catch (e2) {
      err.textContent = "Gagal membuat ruang: " + e2.message;
      err.classList.remove("hidden");
    } finally {
      btn.disabled = false;
      btn.textContent = "Buat Ruang Kelas";
    }
  });

  $("btn-siswa").addEventListener("click", () => {
    $("form-guru").classList.add("hidden");
    $("form-siswa").classList.remove("hidden");
    $("inp-kode").focus();
  });

  $("form-siswa").addEventListener("submit", (e) => {
    e.preventDefault();
    const kode = $("inp-kode").value.trim().toUpperCase();
    const nama = $("inp-nama").value.trim();
    if (!kode || !nama) return;
    tampilkanEditor("siswa", kode, nama);
    buatEditorSiswa();
    hubungkan();
  });

  $("btn-run").addEventListener("click", jalankan);

  $("btn-ikuti").addEventListener("click", () => {
    S.ikuti = !S.ikuti;
    perbaruiTombolIkuti();
    if (S.ikuti && typeof S.barisTerakhir === "number") {
      scrollKeBaris(S.siswaView, S.barisTerakhir);
    }
  });

  let worker = null, workerSiap = null;

  function initWorker() {
    if (worker) return workerSiap;
    const el = $("py-state");
    el.textContent = "Memuat Python...";
    workerSiap = new Promise((resolve, reject) => {
      worker = new Worker(new URL("worker.js", location.href).pathname);
      worker.onmessage = (ev) => {
        const m = ev.data;
        if (m.tipe === "siap") resolve();
        else if (m.tipe === "muat-gagal") reject(new Error(m.pesan));
        else tanganiWorker(m);
      };
      worker.onerror = () => reject(new Error("Gagal memuat mesin Python."));
    }).then(() => { el.textContent = "Python siap"; return worker; })
      .catch(e => { el.textContent = "Gagal memuat Python"; throw e; });
    worker.postMessage({ tipe: "muat" });
    return workerSiap;
  }

  function mulaiPramuatPython() {
    if (S.pramuat) return;
    S.pramuat = true;
    initWorker().catch(() => {});
  }

  function clipHasil() {
    const c = $("output");
    while (c.firstChild) c.removeChild(c.firstChild);
  }

  function tulisHasil(ch, cls) {
    const c = $("output");
    const s = document.createElement("span");
    if (cls) s.className = cls;
    s.textContent = ch;
    c.appendChild(s);
    c.scrollTop = c.scrollHeight;
  }

  function tulisInfo(ch) {
    const c = $("output");
    const s = document.createElement("div");
    s.className = "thin";
    s.textContent = ch;
    c.appendChild(s);
    c.scrollTop = c.scrollHeight;
  }

  function setOutput(teks, label) {
    $("output-head").textContent = label || "Hasil Run";
    $("output-pane").classList.remove("hidden");
    clipHasil();
    if (teks) tulisHasil(teks + "\n");
  }

  function tampilkanInput(id, prompt) {
    if (S.inputAktif !== null) return;
    S.inputAktif = id;
    const lead = (prompt || "").toString();
    const c = $("output");
    const line = document.createElement("div");
    line.className = lead ? "input-line no-prefix" : "input-line";
    line.innerHTML = `
      ${lead ? '<span class="prompt"></span>' : ""}
      <input id="run-input" type="text" class="run-input" placeholder="Input..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="run-input-btn" class="run-input-btn" type="button">OK</button>`;
    if (lead) line.querySelector(".prompt").textContent = lead;
    c.appendChild(line);
    c.scrollTop = c.scrollHeight;
    const inp = $("run-input");
    inp.focus();
    const urlJawab = `${location.origin}/api/stdin/${encodeURIComponent(S.kode)}/jawab`;
    const kirim = () => {
      if (S.inputAktif !== id) return;
      const nilai = inp.value;
      S.inputAktif = null;
      line.remove();
      tulisHasil(lead + nilai + "\n");
      fetch(urlJawab, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, nilai }),
      }).catch(() => {});
    };
    const batalkan = () => {
      if (S.inputAktif !== id) return;
      S.inputAktif = null;
      line.remove();
      tulisInfo("(input dibatalkan)");
      fetch(urlJawab, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, batal: true }),
      }).catch(() => {});
    };
    $("run-input-btn").addEventListener("click", kirim);
    inp.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") { ev.preventDefault(); kirim(); }
      else if (ev.key === "Escape") batalkan();
    });
  }

  function tanganiWorker(m) {
    switch (m.tipe) {
      case "out":
        S.runOut += m.data + (m.data.endsWith("\n") ? "" : "\n");
        tulisHasil(m.data + (m.data.endsWith("\n") ? "" : "\n"), m.galat ? "stderr" : null);
        break;
      case "prompt-teks": S.promptBerikut = m.teks; break;
      case "input":
        tampilkanInput(m.id, m.prompt != null ? m.prompt : (S.promptBerikut || ""));
        S.promptBerikut = null;
        break;
      case "selesai":
        if (m.ret !== null) {
          S.runOut += m.ret + "\n";
          tulisHasil(m.ret + "\n");
        }
        selesaiRun();
        break;
      case "galat": {
        const p = m.pesan.replace(/\n+$/, "");
        if (!S.runOut.endsWith(p + "\n")) {
          S.runOut += p + "\n";
          tulisHasil(p + "\n", "stderr");
        }
        selesaiRun();
        break;
      }
    }
  }

  function selesaiRun() {
    S.running = false;
    S.inputAktif = null;
    $("output-head").textContent = "Hasil Run";
    let out = S.runOut;
    if (!out.trim()) {
      out = "(tidak ada output)";
      tulisInfo(out);
    }
    const btn = $("btn-run");
    btn.disabled = false;
    btn.textContent = "Jalankan";
    if (S.peran === "guru" && S.ws && S.ws.readyState === 1) {
      S.ws.send(JSON.stringify({ tipe: "output", teks: out }));
    }
  }

  async function jalankan() {
    const btn = $("btn-run");
    if (btn.disabled || S.running) return;
    const code = S.peran === "guru"
      ? S.guruView.state.doc.toString()
      : S.siswaView.state.doc.toString();
    const barisInput = document.querySelector(".input-line");
    if (barisInput) barisInput.remove();
    S.running = true;
    S.runOut = "";
    btn.disabled = true;
    btn.textContent = "Menjalankan...";
    $("output-head").textContent = "Menjalankan…";
    $("output-pane").classList.remove("hidden");
    clipHasil();
    try {
      await initWorker();
    } catch (e) {
      S.running = false;
      btn.disabled = false;
      btn.textContent = "Jalankan";
      $("output-head").textContent = "Hasil Run";
      clipHasil();
      tulisHasil(e.message + "\n", "stderr");
      return;
    }
    worker.postMessage({ tipe: "jalan", kode: code, ruang: S.kode });
  }

  $("btn-copy").addEventListener("click", async () => {
    const url = `${location.origin}${location.pathname}?kelas=${S.kode}`;
    try {
      await navigator.clipboard.writeText(url);
      $("btn-copy").textContent = "Tersalin!";
      setTimeout(() => $("btn-copy").textContent = "Salin link", 1500);
    } catch {
      prompt("Salin link berikut:", url);
    }
  });

  $("btn-leave").addEventListener("click", () => {
    if (S.ws) { S.ws.onclose = null; S.ws.close(); }
    location.reload();
  });

  const params = new URLSearchParams(location.search);
  const kodeDariLink = params.get("kelas");
  if (kodeDariLink && /^[A-Z2-9]{5}$/i.test(kodeDariLink)) {
    $("inp-kode").value = kodeDariLink.toUpperCase();
    $("form-siswa").classList.remove("hidden");
  }
</script>
</body>
</html>
